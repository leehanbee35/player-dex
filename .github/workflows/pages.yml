name: 도감 페이지 배포

# 화면(index.html)이나 사진·명단 파일이 바뀌면 수집을 기다리지 않고 바로 배포
on:
  push:
    branches: [main]
    paths: ["index.html", "photos/**", "data/**", "reactions/reactions.json"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # 연달아 올리면 마지막 것만 배포

jobs:
  # 1) 페이지 파일 묶기
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 2) 묶은 파일을 Pages에 배포 (같은 단계에서 하면 묶음을 못 찾는 문제가 있어 분리)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
