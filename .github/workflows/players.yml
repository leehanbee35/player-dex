name: 전체 선수 명단 갱신

on:
  schedule:
    - cron: "0 20 * * 0"   # 매주 월요일 05:00 KST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/build_players.py", "data/photos.py", "data/kleague.py", "data/curated.json", "data/names.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: players          # 반응 수집과 따로 (같은 대기열이면 하나가 취소됨)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 앞선 실행이 올린 한글 표기(ko.json)까지 받은 뒤 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reactions/requirements.txt
      - run: python -u data/build_players.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: 결과 커밋
        run: |
          git config user.name "players-bot"
          git config user.email "players-bot@users.noreply.github.com"
          git add data/players.json data/players-a.json data/players-b.json data/ids.json data/ko.json
          if [ -f data/transfers.json ]; then git add data/transfers.json; fi
          if [ -f data/photos.json ]; then git add data/photos.json; fi
          git diff --cached --quiet || git commit -m "선수 명단 갱신"
          # 다른 실행과 동시에 올리면 거절될 수 있어서 3번까지 다시 시도
          # 자동으로 만든 데이터 파일끼리 충돌하면 방금 만든 쪽(-X theirs)을 씀. 3번 다 실패하면 실행을 실패로 표시
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 10; done; [ "$ok" = 1 ]
      - uses: actions/configure-pages@v5
      # 검색 엔진용 선수 페이지·sitemap.xml 만들기 (저장소에는 안 올림)
      - run: python3 -u data/build_pages.py
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    # 사이트 배포는 세 작업이 같은 줄에 서서 하나씩 (동시에 배포하면 하나가 실패함)
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
