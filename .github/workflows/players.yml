name: 전체 선수 명단 갱신

on:
  schedule:
    - cron: "0 20 * * 0"   # 매주 월요일 05:00 KST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/build_players.py", "data/photos.py", "data/curated.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: players          # 반응 수집과 따로 (같은 대기열이면 하나가 취소됨)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 앞선 실행이 올린 한글 표기(ko.json)까지 받은 뒤 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reactions/requirements.txt
      - run: python -u data/build_players.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
      - name: 결과 커밋
        run: |
          git config user.name "players-bot"
          git config user.email "players-bot@users.noreply.github.com"
          git add data/players.json data/ids.json data/ko.json
          if [ -f data/photos.json ]; then git add data/photos.json; fi
          git diff --cached --quiet || git commit -m "선수 명단 갱신"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
