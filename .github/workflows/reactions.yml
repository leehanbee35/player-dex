name: 선수 반응 수집

on:
  schedule:
    - cron: "0 */3 * * *"  # 3시간마다 (실시간 화제용)
  workflow_dispatch: {}    # Actions 탭에서 수동 실행
  # 화면 배포는 pages.yml이 따로 함 (수집을 기다리지 않게)
  push:
    branches: [main]
    paths: ["reactions/collect.py", "data/korean_games.py", ".github/workflows/reactions.yml"]   # 수집기를 고치면 바로 한 번 실행해서 확인

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reactions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      credit_low: ${{ steps.check.outputs.low }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 기다렸다 시작해도 최신 저장소(앞 실행의 결과 포함)에서 시작
      # 기사 저장 파일(reactions.db)은 3시간마다 바뀌어서 저장소 대신 캐시에 보관 (저장소가 커지지 않게)
      - uses: actions/cache@v4
        with:
          path: reactions/reactions.db
          key: reactions-db-${{ github.run_id }}
          restore-keys: reactions-db-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reactions/requirements.txt
      # 해외 리그 한국 선수의 다음 경기·최근 결과 (첫 화면 "오늘 뛰는 한국 선수"). 실패해도 반응 수집은 계속
      - run: python -u data/korean_games.py
        continue-on-error: true
      - run: python -u reactions/collect.py | tee "$RUNNER_TEMP/collect.log"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
          # 선택: 네이버 검색 API 키가 있으면 네이버 뉴스도 함께 수집
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 선택: 유튜브 Data API 키가 있으면 하루 한 번 유튜브 인기 댓글(커뮤니티 반응)도 수집
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - id: check
        name: 크레딧 확인
        run: |
          if grep -q "credit balance is too low" "$RUNNER_TEMP/collect.log"; then echo "low=1" >> "$GITHUB_OUTPUT"; fi
      - name: 결과 커밋
        run: |
          git config user.name "reactions-bot"
          git config user.email "reactions-bot@users.noreply.github.com"
          git add reactions/reactions.json
          if [ -f data/games.json ]; then git add data/games.json; fi
          git diff --cached --quiet || git commit -m "반응 데이터 갱신"
          # 다른 실행과 동시에 올리면 거절될 수 있어서 3번까지 다시 시도
          # 자동으로 만든 데이터 파일끼리 충돌하면 방금 만든 쪽(-X theirs)을 씀. 3번 다 실패하면 실행을 실패로 표시
          ok=0; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 10; done; [ "$ok" = 1 ]
      # 도감 페이지(index.html + 최신 reactions.json)를 Pages용으로 묶기
      - uses: actions/configure-pages@v5
      # 검색 엔진용 선수 페이지·sitemap.xml 만들기 (저장소에는 안 올림)
      - run: python3 -u data/build_pages.py
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 묶은 페이지를 GitHub Pages에 배포 (수집이 끝난 뒤 별도 단계로)
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Claude API 크레딧이 떨어지면 이 단계가 실패 → GitHub이 저장소 주인에게 실패 메일을 보냄
  alert:
    needs: collect
    if: needs.collect.outputs.credit_low == '1'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Claude API 크레딧이 부족해서 기사 분류를 못 했어요. console.anthropic.com → Settings → Billing에서 충전해 주세요."
          exit 1
