name: 선수 반응 수집

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
    - cron: "0 9 * * *"    # 매일 18:00 KST
  workflow_dispatch: {}    # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reactions/requirements.txt
      - run: python reactions/collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 선택: 네이버 검색 API 키가 있으면 네이버 뉴스도 함께 수집
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: 결과 커밋
        run: |
          git config user.name "reactions-bot"
          git config user.email "reactions-bot@users.noreply.github.com"
          git add reactions/reactions.db reactions/reactions.json
          git diff --cached --quiet || git commit -m "반응 데이터 갱신"
          git push
