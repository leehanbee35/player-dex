name: 선수 반응 수집

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
    - cron: "0 9 * * *"    # 매일 18:00 KST
  workflow_dispatch: {}    # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["index.html", "photos/**"]   # 도감 페이지를 고치면 바로 다시 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reactions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      credit_low: ${{ steps.check.outputs.low }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reactions/requirements.txt
      - run: python -u reactions/collect.py | tee "$RUNNER_TEMP/collect.log"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
          # 선택: 네이버 검색 API 키가 있으면 네이버 뉴스도 함께 수집
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - id: check
        name: 크레딧 확인
        run: |
          if grep -q "credit balance is too low" "$RUNNER_TEMP/collect.log"; then echo "low=1" >> "$GITHUB_OUTPUT"; fi
      - name: 결과 커밋
        run: |
          git config user.name "reactions-bot"
          git config user.email "reactions-bot@users.noreply.github.com"
          git add reactions/reactions.db reactions/reactions.json
          git diff --cached --quiet || git commit -m "반응 데이터 갱신"
          # 다른 실행과 동시에 올리면 거절될 수 있어서 3번까지 다시 시도
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
      # 도감 페이지(index.html + 최신 reactions.json)를 Pages용으로 묶기
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 묶은 페이지를 GitHub Pages에 배포 (수집이 끝난 뒤 별도 단계로)
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Claude API 크레딧이 떨어지면 이 단계가 실패 → GitHub이 저장소 주인에게 실패 메일을 보냄
  alert:
    needs: collect
    if: needs.collect.outputs.credit_low == '1'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Claude API 크레딧이 부족해서 기사 분류를 못 했어요. console.anthropic.com → Settings → Billing에서 충전해 주세요."
          exit 1
