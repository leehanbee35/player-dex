<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>풋볼 도감</title>
<meta name="description" content="해외축구·K리그 선수 1만여 명의 팀·국적·시즌 기록과 최근 뉴스·커뮤니티 반응, 팬 댓글을 한눈에 보는 축구 선수 도감입니다.">

<script>/* 기본은 다크 모드. 헤더의 ☀/☾ 버튼으로 바꾸면 이 브라우저에 기억 */try{document.documentElement.dataset.theme=localStorage.getItem("dexTheme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: navy pitch-side header + filter rail, then a dense card grid like a sticker album */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#18223a; --muted:#5b6680; --line:#d6dce8;
  --head:#16213b; --head-ink:#f2f5fb; --head-muted:#9aa6c2; --chip:#24304f; --accent:#2fbf71;
  --gk:#d99a1a; --gk-soft:#fbf0d6; --df:#2f6fd6; --df-soft:#dde8fb; --link:#2563c9; --sb:#c3cad9; --sb-h:#9aa4ba;
  --mf:#21a05e; --mf-soft:#d9f2e4; --fw:#e0533d; --fw-soft:#fbe1dc;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#172036; --ink:#e8ecf5; --muted:#99a4bd; --line:#2a3552;
  --head:#0a0f1d; --head-ink:#eef2fa; --head-muted:#8591ad; --chip:#1d2741;
  --gk-soft:#3a2f17; --df-soft:#1a2b4a; --mf-soft:#15352a; --fw-soft:#3d1f1b; --link:#8cb8ff; --sb:#34405e; --sb-h:#4d5b80; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172036; --ink:#e8ecf5; --muted:#99a4bd; --line:#2a3552;
  --head:#0a0f1d; --head-ink:#eef2fa; --head-muted:#8591ad; --chip:#1d2741;
  --gk-soft:#3a2f17; --df-soft:#1a2b4a; --mf-soft:#15352a; --fw-soft:#3d1f1b; --link:#8cb8ff; --sb:#34405e; --sb-h:#4d5b80; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
a{color:var(--link)}
/* 스크롤바: 얇고 둥근 막대, 바탕은 투명 (크롬·사파리·엣지는 ::-webkit-scrollbar, 파이어폭스는 scrollbar-color) */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background-color:var(--sb-h)}
*::-webkit-scrollbar-corner{background:transparent}
@supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--head);color:var(--head-ink)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.logo{font-family:var(--f-display);font-size:26px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.search{flex:1;min-width:200px;max-width:520px;display:flex;align-items:center;background:#fff;border-radius:999px;padding:4px 6px 4px 16px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;color:#18223a;background:transparent;padding:6px 0;min-width:0}
.search span{font-size:11px;color:#5b6680;margin-right:10px;padding-right:10px;white-space:nowrap;position:relative}
.search span::after{content:"";position:absolute;right:0;top:50%;height:12px;margin-top:-6px;border-left:1px solid #c9d0dd}
.search:focus-within{box-shadow:0 0 0 3px var(--accent)}
.theme-btn{margin-left:auto;width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:none;color:var(--head-ink);font-size:16px;line-height:1;cursor:pointer}
.theme-btn:hover{background:rgba(255,255,255,.08)}
.theme-btn:focus-visible{outline:2px solid var(--accent)}

/* 헤더 고정: 스크롤해도 검색·필터가 위에 남음. 내려가면(.stuck) 아래 내용과 구분되게 그림자만 */
header{position:sticky;top:0;z-index:30;transition:box-shadow .2s}
header.stuck{box-shadow:0 6px 18px rgba(0,0,0,.28)}
/* 맨 위로 버튼: 조금 내려가면 오른쪽 아래에 나타남 */
.to-top{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:opacity .2s,transform .2s}
.to-top[hidden]{display:grid;opacity:0;transform:translateY(12px);pointer-events:none}
.to-top:hover{border-color:var(--accent);color:var(--accent)}
.to-top:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* PC: 검색줄만 위에 붙고, 필터 줄은 내용과 함께 스크롤되어 올라감 (접히는 순간 화면이 튀지 않음) */
@media (min-width:641px){
  header{display:contents}
  header>.top{position:sticky;top:0;z-index:30;background:var(--head);color:var(--head-ink);box-shadow:0 0 0 100vmax var(--head);clip-path:inset(0 -100vmax);transition:none}
  header.stuck>.top{clip-path:inset(0 -100vmax -24px -100vmax);box-shadow:0 0 0 100vmax var(--head),0 6px 18px rgba(0,0,0,.28)}
  header>.rail{position:relative;z-index:29;color:var(--head-ink)}
  header>.rail::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--head);box-shadow:0 0 0 100vmax var(--head);clip-path:inset(0 -100vmax)}
}
.rail{padding-block:10px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid rgba(255,255,255,.08)}
.pos-row{order:2;display:flex;gap:6px;overflow-x:auto;padding:6px 4px 2px;margin:-6px -4px 0}
.pos{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:0;color:var(--head-muted);font:inherit;font-size:11px;cursor:pointer;padding:4px 6px;border-radius:10px}
.pos b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-family:var(--f-num);font-weight:700;font-size:15px;color:#fff;opacity:.55;transition:opacity .15s,transform .15s}
.pos[aria-pressed="true"]{color:var(--head-ink)}
.pos[aria-pressed="true"] b{opacity:1;transform:scale(1.06);box-shadow:0 0 0 2px var(--head),0 0 0 4px currentColor}
.pos:hover b{opacity:.9}
.pos:focus-visible{outline:2px solid var(--accent)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls label{font-size:11px;color:var(--head-muted);display:flex;align-items:center;gap:6px}
select{font:inherit;font-size:13px;background:var(--chip);color:var(--head-ink);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 8px;max-width:180px}
/* 커스텀 드롭다운 (원래 select는 상태 보관용으로 숨김) */
.sr-only{position:absolute!important;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.dd{position:relative}
/* 헤더 컨트롤(셀렉트·세그먼트·버튼) 높이는 모두 32px로 통일 */
.dd-btn,.seg,.reset,.fav-toggle{box-sizing:border-box;height:32px}
.dd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;min-width:150px;max-width:210px;font:inherit;font-size:13px;background:var(--chip);color:var(--head-ink);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:0 9px 0 11px;cursor:pointer}
.dd-btn:hover{border-color:rgba(255,255,255,.28)}
.dd-btn[aria-expanded="true"]{border-color:var(--accent)}
.dd-btn:focus-visible{outline:2px solid var(--accent)}
.dd-val{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.dd-val .txt{overflow:hidden;text-overflow:ellipsis}
.dd-val .cnt{display:none}
.dd-chev{width:12px;height:12px;flex:0 0 auto;opacity:.7;transition:transform .15s}
.dd-btn[aria-expanded="true"] .dd-chev{transform:rotate(180deg)}
.dd-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:max(100%,220px);width:max-content;max-width:300px;padding:4px;background:var(--head);border:1px solid rgba(255,255,255,.14);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.dd-pop[hidden]{display:none}
.dd-list{max-height:300px;overflow-y:auto;margin:0;padding:0;list-style:none}
.dd-q{display:block;width:100%;box-sizing:border-box;height:32px;margin:0 0 4px;padding:0 10px;font:inherit;font-size:13px;color:var(--head-ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:7px;outline:none}
.dd-q::placeholder{color:var(--head-muted)}
.dd-q:focus{border-color:var(--accent)}
.dd-opt[hidden]{display:none}
.dd-empty{margin:0;padding:10px;font-size:12.5px;color:var(--head-muted)}
.dd-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--head-ink);white-space:nowrap;cursor:pointer}
.dd-opt:hover,.dd-opt.active{background:rgba(255,255,255,.08)}
.dd-opt[aria-selected="true"]{color:var(--accent);font-weight:700}
.dd-opt .cnt{margin-left:auto;padding-left:14px;color:var(--head-muted);font-family:var(--f-num);font-weight:500}
.dd .star{color:#f5c542}
.seg{display:inline-flex;align-items:stretch;background:var(--chip);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:2px}
.seg button{font:inherit;font-size:12px;border:0;background:none;color:var(--head-muted);padding:0 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#0b1a12;font-weight:700}
.favline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.favline .favbar{flex:1;min-width:0}
.reset{flex:0 0 auto;margin-left:auto;width:32px;display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid rgba(255,255,255,.2);color:var(--head-muted);border-radius:8px;padding:0;cursor:pointer;transition:color .15s,border-color .15s}
.reset:hover{color:var(--head-ink);border-color:rgba(255,255,255,.4)}
.reset svg{transition:transform .25s}.reset:hover svg{transform:rotate(-60deg)}

main{padding-block:24px 56px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:16px}
#out>.group-h:first-child{margin-top:4px}
.meta>div:first-child{display:flex;flex-wrap:wrap;align-items:center;column-gap:4px;row-gap:6px}
.meta strong{line-height:1}
.meta .crit{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:6px}
.crit-sep{display:none}
.crit-tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:11.5px;font-weight:600}
.crit-kv{font-size:11.5px;color:var(--muted);margin-left:4px}.crit-kv b{color:var(--ink);font-weight:600}
.meta strong{color:var(--ink);font-family:var(--f-num);font-size:16px}
.group-h{font-family:var(--f-body);font-size:18px;font-weight:800;letter-spacing:-.2px;margin:32px 0 12px;display:flex;align-items:center;gap:10px}
.group-h small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}

.card{--c:var(--fw);--soft:var(--fw-soft);background:var(--surface);border:2px solid var(--c);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,30,60,.15)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card.GK{--c:var(--gk);--soft:var(--gk-soft)} .card.DF{--c:var(--df);--soft:var(--df-soft)} .card.MF{--c:var(--mf);--soft:var(--mf-soft)}
.c-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;padding:7px 10px;background:var(--soft)}
.c-head .c-name{text-align:left;white-space:normal;overflow:visible;text-overflow:clip;word-break:keep-all;overflow-wrap:anywhere;line-height:1.25}
.c-tr{display:flex;justify-content:flex-end}
.c-no{font-family:var(--f-num);font-weight:600;color:var(--muted);font-size:13px}
.c-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-art{background:linear-gradient(180deg,var(--soft),var(--surface));display:grid;place-items:center;padding:10px 0 4px}
.c-art svg{width:96px;height:96px}
/* 최근 24시간 안에 새 기사가 나온 선수 */
.c-art{position:relative}
.c-new{font-family:var(--f-num);font-size:10px;font-weight:800;letter-spacing:.5px;line-height:1;padding:4px 6px;border-radius:5px;background:#e5484d;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.c-art img{width:100px;height:100px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:3px solid var(--c);background:var(--soft)}
.d-top img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:0 0 auto;border:3px solid var(--line)}
.fav-star{color:var(--gk)}
.pick{display:inline-flex;align-items:center;gap:2px}
/* 나라 | 리그 | 정렬 | 묶어보기 사이 세로 구분선 */
.ctrls{column-gap:12px}
.ctrls>.pick+*, .ctrls>label+label, .ctrls>.pos-slot+label{position:relative;padding-left:12px}
.ctrls>.pos-slot+label::before, .ctrls>.pick+*::before, .ctrls>label+label::before{content:"";position:absolute;left:0;top:50%;height:12px;margin-top:-6px;border-left:1px solid rgba(255,255,255,.28)}
.fav-toggle{font:inherit;font-size:17px;line-height:1;background:none;border:0;color:var(--head-muted);cursor:pointer;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center}
.fav-toggle[aria-pressed="true"]{color:#f5c542}
.fav-toggle:disabled{opacity:.3;cursor:default}
.fav-toggle:focus-visible{outline:2px solid var(--accent)}
.favbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.favbar>span{font-size:11px;color:var(--head-muted);position:relative;padding-right:12px;margin-right:4px}
.favbar>span::after{content:"";position:absolute;right:0;top:50%;height:12px;margin-top:-6px;border-left:1px solid rgba(255,255,255,.28)}
.favbar>em{font-style:normal;font-size:11.5px;color:var(--head-muted)}
.fchip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;background:var(--chip);color:var(--head-ink);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 4px 3px 10px;cursor:pointer}
.fchip[aria-pressed="true"]{background:#f5c542;color:#1d1a0b;border-color:#f5c542}
.fchip .x{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;opacity:.65}
.fchip .x:hover{opacity:1;background:rgba(0,0,0,.18)}
.fchip:focus-visible{outline:2px solid var(--accent)}
.meta .clear{font:inherit;font-size:12px;background:none;border:0;color:var(--link);cursor:pointer;padding:0;text-decoration:underline}
.fav-btn{font:inherit;font-size:15px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;border-radius:4px}
.fav-btn:hover{color:var(--gk)}
.fav-btn[aria-pressed="true"]{color:var(--gk)}
.fav-btn:focus-visible{outline:2px solid var(--accent)}
.comments{border-top:1px solid var(--line);padding-top:14px}
.comments h3{margin:0;font-size:14px}
.c-note{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.c-note a{color:var(--link)}
/* 디씨 스타일 댓글 */
.cm-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cm-head h3 small{font-family:var(--f-num);font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.cm-sort{display:inline-flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.cm-sort button{font:inherit;font-size:11.5px;border:0;background:none;color:var(--muted);padding:4px 9px;border-radius:6px;cursor:pointer}
.cm-sort button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.cm-form{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px}
.cm-row{display:flex;gap:6px}
.cm-form input,.cm-form textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.cm-row input{flex:1}
.cm-form textarea{resize:vertical;min-height:58px;line-height:1.5}
.cm-form input:focus,.cm-form textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.cm-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cm-msg{flex:1;color:var(--fw)}
.cm-msg.ok{color:var(--mf)}
.cm-submit{font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:6px;padding:6px 14px;background:var(--df);color:#fff;cursor:pointer}
.cm-submit:disabled{opacity:.5;cursor:default}
.cm-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.cm-item{padding:10px 2px;border-bottom:1px solid var(--line)}
.cm-item.best{background:var(--fw-soft);border-radius:8px;padding:10px;border-bottom:0;margin-bottom:4px}
.cm-meta{display:flex;align-items:baseline;gap:6px;font-size:12px;flex-wrap:wrap}
.cm-meta b{font-size:12.5px}
.cm-meta .ip{color:var(--muted);font-family:var(--f-num)}
.cm-meta time{margin-left:auto;color:var(--muted);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.cm-best{font-size:10.5px;font-weight:700;color:#fff;background:var(--fw);border-radius:4px;padding:1px 6px}
.cm-item p{margin:5px 0 6px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.cm-act{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.cm-act button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.cm-act .up{color:var(--link)} .cm-act .down{color:var(--fw)}
.cm-act .ghost{border-color:transparent;background:none;color:var(--muted)}
.cm-act input{font:inherit;font-size:12px;width:110px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--surface);color:var(--ink)}
.cm-act .note{font-size:11.5px;color:var(--muted);margin-left:4px}
/* 답글 */
.cm-replies{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.cm-item.reply{padding:8px 0;border-bottom:0}
.cm-item.reply+.cm-item.reply{border-top:1px dashed var(--line)}
.cm-re{color:var(--muted);margin-right:2px}
.cm-rform{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.cm-rform input,.cm-rform textarea{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);min-width:0}
.cm-rform textarea{min-height:56px;resize:vertical}
.cm-rform .cm-foot{gap:6px}
.cm-rform .cm-foot .ghost{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer}
.cm-empty{padding:14px 0;color:var(--muted);font-size:12.5px;text-align:center}
.credit{font-size:11px;color:var(--muted);margin:0;line-height:1.5}
.credit a{color:inherit}
.badges{display:flex;gap:5px;padding:4px 10px 8px;flex-wrap:wrap;align-items:center}
.badges .bdg{display:inline-flex;align-items:center;height:22px;line-height:1;padding:0 8px;font-size:11px;box-sizing:border-box;font-family:var(--f-body);letter-spacing:0}
.bdg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;color:#fff;background:var(--c);border:1px solid transparent;justify-content:center;font-family:var(--f-num);letter-spacing:.4px}
.bdg.ghost{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);font-family:var(--f-body);font-weight:500}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:9px 10px 13px;margin:auto 0 0;border-top:1px dashed var(--line);font-size:12px}
.stats dt{color:var(--muted)} .stats dd{margin:0;font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;padding:24px 0 8px}
.more button{font:inherit;font-weight:600;font-size:14px;padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.more button:hover{border-color:var(--muted)}
.more small{color:var(--muted);font-weight:500;margin-left:6px;font-family:var(--f-num)}
img.flag{object-fit:cover;background:var(--line)}

/* 선수 상세 팝업: 넓은 화면은 왼쪽 정보·반응 | 오른쪽 댓글, 좁은 화면은 한 줄. 닫기 버튼은 고정, 내용만 스크롤 */
dialog{border:0;border-radius:16px;padding:0;width:min(980px,calc(100vw - 32px));max-width:none;height:min(760px,calc(100dvh - 40px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--ink);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(8,12,24,.6)}
.d-shell{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
#dBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.d-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;padding:0 22px 22px;align-items:stretch}
.d-main{display:flex;flex-direction:column;gap:14px;min-width:0;align-self:start}
.d-grid .comments{border-top:0;padding-top:0;padding-left:22px;border-left:1px solid var(--line);min-width:0}
@media (max-width:820px){
  .d-info{grid-template-columns:repeat(3,minmax(0,1fr))}
  .d-grid{grid-template-columns:1fr;padding:0 16px 18px}
  .d-grid .comments{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}
}
.d-top{padding:20px 64px 16px 22px;display:flex;gap:16px;align-items:center}
.d-top svg{width:84px;height:84px;flex:0 0 auto}
.d-top h2{font-family:var(--f-display);font-size:26px;margin:0;font-weight:400}
.d-top p{margin:2px 0 0;color:var(--muted)}
.d-info{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:0 22px}
/* 상세 팝업: 왼쪽 프로필(고정) + 오른쪽 탭 내용(이 칸만 스크롤) */
dialog{width:min(1180px,calc(100vw - 32px));height:min(760px,calc(100dvh - 40px))}
#dBody{display:grid;grid-template-columns:340px minmax(0,1fr) 340px;overflow:hidden}
/* 댓글은 탭과 상관없이 오른쪽에 항상 */
.d-cm{border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:16px 18px 22px 18px;overscroll-behavior:contain}
.d-cm .comments{border-top:0;padding-top:0}
.d-cm .cm-head{padding-right:40px}
.d-side{border-right:1px solid var(--line);padding:24px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.d-side .d-top{padding:0;flex-direction:column;align-items:center;text-align:center;gap:12px}
.d-side .d-top img,.d-side .d-top svg{width:96px;height:96px}
.d-side .d-top h2{font-size:24px}
.d-side .d-info{grid-template-columns:repeat(2,minmax(0,1fr));padding:0}
.d-content{overflow-y:auto;min-height:0;min-width:0;overscroll-behavior:contain}
.d-content .d-tabs{margin-top:0;padding-top:10px;padding-right:60px}
/* 폭이 좁으면(1100px 이하) 댓글은 탭 내용 아래로, 팝업 전체가 스크롤하고 프로필은 왼쪽에 붙어 있음 */
@media (max-width:1100px){
  #dBody{grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto 1fr;overflow-y:auto;background:linear-gradient(var(--line),var(--line)) 319px 0/1px 100% no-repeat local}
  #dBody>.d-side{border-right:0}
  .d-side{grid-row:1 / span 2;position:sticky;top:0;align-self:start;max-height:100%}
  .d-content{overflow:visible}
  .d-cm{grid-column:2;border-left:0;border-top:1px solid var(--line);overflow:visible;padding:16px 22px 24px}
  .d-cm .cm-head{padding-right:0}
}
/* 태블릿·폰: 프로필 위, 탭 내용 아래로 쌓고 팝업 전체가 스크롤 */
@media (max-width:820px){
  #dBody{display:block;overflow-y:auto}
  .d-side{border-right:0;padding:18px 16px 0;overflow:visible;position:static;max-height:none}
  .d-cm{padding:14px 16px 24px}
  .d-side .d-top{flex-direction:row;text-align:left;padding-right:44px}
  .d-side .d-top img,.d-side .d-top svg{width:72px;height:72px}
  .d-side .d-info{grid-template-columns:repeat(3,minmax(0,1fr))}
  .d-content{overflow:visible}
  .d-content .d-tabs{padding-right:12px;margin-top:14px}
}
/* 상세 팝업 탭 */
.d-tabs{display:flex;gap:4px;padding:0 22px;margin-top:16px;box-shadow:inset 0 -1px 0 var(--line);position:sticky;top:0;background:var(--surface);z-index:1;overflow-x:auto;scrollbar-width:none}
.d-tabs button{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--muted);padding:10px 12px 12px;cursor:pointer;white-space:nowrap}
.d-tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.d-tabs .tc{font-size:11px;font-weight:700;margin-left:5px;color:var(--muted)}
.d-tabs .tc:empty{display:none}
.d-pane{padding:16px 22px 18px;min-height:220px}
.d-pane .season{margin-top:0}
.d-pane h3.pane-h{margin:0 0 10px;font-size:14px}
/* PC에서는 경기 탭 없이 기록 탭 아래에 이어서 */
@media (min-width:821px){
  .d-tabs button[data-dt="games"]{display:none}
  .d-pane[data-pane="games"]{padding-top:0;min-height:0}
}
@media (max-width:820px){.d-pane h3.pane-h{display:none}}
.d-side .credit{text-align:center;margin-top:auto}
.d-pane .comments{border-top:0;padding-top:0}
.d-info>div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.d-info span{display:block;font-size:11px;color:var(--muted)} .d-info b{font-size:14px}
.d-info .lab{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:2px}
.d-info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.react{border:1px dashed var(--line);border-radius:12px;padding:14px}
.react h3{margin:0 0 6px;font-size:14px}
.react p{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.6}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font-size:12px;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.links a:hover{border-color:var(--accent)}
.links a{display:inline-flex;align-items:center;gap:5px}
.ext{width:11px;height:11px;flex:0 0 auto;opacity:.65}
.close{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--bg);font-size:20px;line-height:1;color:var(--ink);cursor:pointer}
.close:hover{background:var(--line)}
.close:focus-visible{outline:2px solid var(--accent)}
.flag{width:18px;height:12px;border-radius:2px;vertical-align:-1px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.bdg.ghost{display:inline-flex;align-items:center;gap:5px}
.group-h .flag{width:27px;height:18px}
.d-info b{display:flex;align-items:center;gap:5px}
.r-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.r-head small{color:var(--muted);font-size:11px}
.sbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--bg)}
.sbar i{display:block}
.s-pos{background:var(--mf)} .s-neu{background:var(--muted);opacity:.45} .s-neg{background:var(--fw)}
.comm{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
/* 상세 화면 이번 시즌 기록 표 */
.season{margin-top:14px}
.season h3{font-size:14px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.season h3 small{font-size:11px;font-weight:400;color:var(--muted)}
.stbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.stbl th{font-weight:500;color:var(--muted);font-size:11px;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.stbl td{text-align:right;padding:6px;border-bottom:1px solid var(--line)}
.stbl th:first-child,.stbl td:first-child{text-align:left;padding-left:0}
.stbl tfoot td{font-weight:700;border-bottom:0}
.bdg.move{background:#f5c542;color:#2a2000;border-color:transparent;font-weight:700}
.d-top h2 .fav-btn{font-size:20px;vertical-align:4px;margin-left:6px}
.d-move{font-size:12.5px!important;margin-top:4px!important;color:var(--muted)}
.d-move b{color:var(--ink)}
.stale{margin:0 0 12px;padding:9px 12px;border-radius:10px;font-size:12.5px;background:rgba(245,197,66,.14);color:var(--ink);border:1px solid rgba(245,197,66,.45)}
/* 광고·제휴 자리 (설정했을 때만 보임) */
.ad-slot{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 0 18px;min-height:0}
.ad-slot[hidden]{display:none}
.ad-label{font-size:10.5px;color:var(--muted);letter-spacing:.5px}
.gear{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.gear a{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;text-decoration:none;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink)}
.gear small{font-size:11px;color:var(--muted)}
/* 첫 화면 위쪽 탭 */
.feed{margin:0 0 28px}
.feed .kgames,.feed .hot{margin:0}
.feed-tabs{display:flex;gap:4px;box-shadow:inset 0 -1px 0 var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.feed-tabs::-webkit-scrollbar{display:none}
.feed-tabs button{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--muted);padding:8px 12px 10px;cursor:pointer;white-space:nowrap}
.feed-tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.feed.tabbed .hot-h h2{display:none}
.feed.tabbed .hot-h{justify-content:flex-start}
/* 첫 화면 한국 선수 경기 */
.kgames{margin:0 0 20px}
.kg-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kg-cols h3{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px}
.kg{list-style:none;margin:0;padding:0 4px 0 0;display:flex;flex-direction:column;gap:6px;max-height:292px;overflow-y:auto;overscroll-behavior:contain}
.kg-it .ph.tm{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.kg-it{width:100%;display:grid;grid-template-columns:54px 36px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.kg-it:hover{border-color:var(--muted)}
.kg-it .kt{font-size:11.5px;color:var(--muted);line-height:1.3;font-variant-numeric:tabular-nums}
.kg-it .kt b{color:var(--ink);font-size:14px}
.kg-it .kt .live{color:var(--fw);font-size:12px}
.kg-it .ph svg,.kg-it .ph img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 18%;display:block}
.kg-it .km{display:flex;flex-direction:column;gap:1px;font-size:13px;min-width:0}
.kg-it .km small{font-size:11.5px;color:var(--muted)}
.kg-it .km .gr{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:10.5px;font-weight:700;color:#fff;background:var(--muted);vertical-align:1px}
.kg-it .km .gr.w{background:var(--mf)} .kg-it .km .gr.l{background:var(--fw)}
/* 다음 경기·최근 경기 */
.games{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ng{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:9px 11px}
.ng .lab{font-size:11px;color:var(--muted)} .ng b{font-size:14px} .ng small{font-size:11.5px;color:var(--muted)}
.glog{list-style:none;margin:0;padding:0;font-size:12.5px}
.glog li{display:grid;grid-template-columns:5.6em 20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.glog .gd{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.glog .gr{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;background:var(--muted)}
.glog .gr.w{background:var(--mf)} .glog .gr.l{background:var(--fw)}
.glog .go{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glog .gs{color:var(--muted);font-size:11.5px;white-space:nowrap}
.stbl.car td:nth-child(2){text-align:left}
.stbl.car th:nth-child(2){text-align:left}
.stbl.car td:first-child{white-space:nowrap;color:var(--muted)}
.stbl tr.sub td{font-size:11px;color:var(--muted);font-weight:600;padding-top:10px;text-align:left}
.season h3 small a{color:inherit}
/* 카드 아래 반응 막대: 최근 7일 기사의 긍정·중립·부정 비율 */
.c-react{display:flex;align-items:center;gap:7px;padding:0 10px 9px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.c-react .mbar{flex:1;display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line)}
.c-react .mbar i{display:block;height:100%}
.c-react b{color:var(--ink);font-weight:600}
/* 첫 화면 "팀 순위" 탭: 리그 고르는 알약 버튼 + 순위표 (안쪽 스크롤) */
.stand{margin:0 0 20px}
.st-wrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,320px);gap:14px;align-items:stretch}
@media (max-width:860px){.st-wrap{grid-template-columns:minmax(0,1fr)}}
.st-tbl tbody tr.on td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.st-tbl tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.st-info{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.sti-h{display:flex;align-items:center;gap:12px}
.sti-h img{width:44px;height:44px;object-fit:contain}
.sti-h .st-ph{width:44px;height:44px;font-size:18px}
.sti-h b{display:block;font-size:17px}
.sti-h small{color:var(--muted);font-size:12px}
.sti-dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sti-dl div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.sti-dl dt{font-size:11px;color:var(--muted);margin-bottom:2px}
.sti-dl dd{margin:0;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.sti-wait{color:var(--muted);font-weight:400}
.sti-sub{font-size:12px;color:var(--muted);font-weight:600}
.sti-ps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sti-p{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;min-width:0;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.sti-p:hover{border-color:var(--accent)}
.sti-p .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.sti-p .ph{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;overflow:hidden;flex:0 0 auto}
.sti-p .ph img,.sti-p .ph svg{width:36px;height:36px;object-fit:cover;object-position:50% 18%}
.sti-go{height:36px;border-radius:8px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sti-src{font-size:12px;color:var(--link);text-align:center}
.st-lgs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.st-lgs::-webkit-scrollbar{display:none}
.st-lgs button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.st-lgs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.st-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:416px;overflow-y:auto;overscroll-behavior:contain}
.st-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.st-tbl th{position:sticky;top:0;z-index:1;background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:600;height:34px;padding:0 6px;box-sizing:border-box;text-align:center;border-bottom:1px solid var(--line)}
.st-tbl td{height:38px;padding:0 6px;text-align:center;border-bottom:1px solid var(--line)}
.st-tbl th,.st-tbl td{white-space:nowrap;min-width:44px}
.st-tbl th:first-child,.st-tbl td:first-child{padding-left:14px}
.st-tbl th:last-child,.st-tbl td:last-child{padding-right:14px}
.st-tbl tr:last-child td{border-bottom:0}
.st-tbl th.tm,.st-tbl td.tm{text-align:left;width:100%}
.st-tbl td.rk{font-weight:700;color:var(--muted)}
.st-tbl th.tm,.st-tbl td.tm{min-width:0;max-width:0}
.st-tbl td.pt{font-weight:700}
.st-tbl tbody tr{cursor:pointer}
.st-tbl tbody tr:hover td,.st-tbl tbody tr:focus-visible td{background:var(--soft-bg,rgba(127,127,127,.08))}
.st-tbl tbody tr:focus-visible{outline:none}

<script>
const POS = {GK:["GK","골키퍼"],CB:["DF","센터백"],LB:["DF","레프트백"],RB:["DF","라이트백"],DM:["MF","수비형 미드"],CM:["MF","중앙 미드"],AM:["MF","공격형 미드"],LW:["FW","왼쪽 윙"],RW:["FW","오른쪽 윙"],ST:["FW","스트라이커"],DF:["DF","수비수"],MF:["MF","미드필더"],FW:["FW","공격수"]};
const GROUP_NAME={GK:"골키퍼",DF:"수비수",MF:"미드필더",FW:"공격수"};
const NAT={KOR:"대한민국",JPN:"일본",ENG:"잉글랜드",FRA:"프랑스",ESP:"스페인",GER:"독일",POR:"포르투갈",BRA:"브라질",ARG:"아르헨티나",NED:"네덜란드",BEL:"벨기에",ITA:"이탈리아",CRO:"크로아티아",NOR:"노르웨이",SWE:"스웨덴",EGY:"이집트",MAR:"모로코",URU:"우루과이",GEO:"조지아",NGA:"나이지리아",USA:"미국",ECU:"에콰도르",HUN:"헝가리",SCO:"스코틀랜드"};
// 국기: Windows는 국기 이모지를 그리지 않아서 30×20 SVG로 직접 그림 (단순화한 모양)
const R=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const V3=(a,b,c)=>R(0,0,10,20,a)+R(10,0,10,20,b)+R(20,0,10,20,c);
const H3=(a,b,c)=>R(0,0,30,7,a)+R(0,6.67,30,6.67,b)+R(0,13.33,30,6.67,c);
const NORDIC=(bg,out,inn)=>R(0,0,30,20,bg)+(inn?R(8,0,6,20,out)+R(0,7,30,6,out)+R(9.5,0,3,20,inn)+R(0,8.5,30,3,inn):R(9,0,4,20,out)+R(0,8,30,4,out));
const STRIPES=(n,a,b)=>Array.from({length:n},(_,i)=>R(0,i*20/n,30,20/n+.05,i%2?b:a)).join("");
const TRIGRAM=(x,y,rot)=>`<g transform="translate(${x} ${y}) rotate(${rot})" fill="#000">${R(-2.5,-2,5,.9,"#000")+R(-2.5,-.45,5,.9,"#000")+R(-2.5,1.1,5,.9,"#000")}</g>`;
const FLAG_SVG={
  KOR:R(0,0,30,20,"#fff")+`<path d="M10 10a5 5 0 0 1 10 0a2.5 2.5 0 0 1-5 0a2.5 2.5 0 0 0-5 0z" fill="#CD2E3A"/><path d="M20 10a5 5 0 0 1-10 0a2.5 2.5 0 0 1 5 0a2.5 2.5 0 0 0 5 0z" fill="#0047A0"/>`+TRIGRAM(6,4.5,-33)+TRIGRAM(24,4.5,33)+TRIGRAM(6,15.5,33)+TRIGRAM(24,15.5,-33),
  JPN:R(0,0,30,20,"#fff")+`<circle cx="15" cy="10" r="6" fill="#BC002D"/>`,
  ENG:R(0,0,30,20,"#fff")+R(13,0,4,20,"#CE1124")+R(0,8,30,4,"#CE1124"),
  SCO:R(0,0,30,20,"#005EB8")+`<path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="3.2"/>`,
  FRA:V3("#0055A4","#fff","#EF4135"), ITA:V3("#009246","#fff","#CE2B37"), BEL:V3("#000","#FDDA24","#EF3340"), NGA:V3("#008751","#fff","#008751"),
  GER:H3("#000","#DD0000","#FFCE00"), NED:H3("#AE1C28","#fff","#21468B"), HUN:H3("#CE2939","#fff","#477050"),
  ESP:R(0,0,30,20,"#AA151B")+R(0,5,30,10,"#F1BF00"),
  POR:R(0,0,30,20,"#DA291C")+R(0,0,12,20,"#046A38")+`<circle cx="12" cy="10" r="4" fill="#FFE900"/><circle cx="12" cy="10" r="2.4" fill="#DA291C"/>`,
  CRO:H3("#FF0000","#fff","#171796")+R(12,5,6,7,"#fff")+[[12,5],[16,5],[14,7],[12,9],[16,9],[14,11]].map(([x,y])=>R(x,y,2,2,"#FF0000")).join(""),
  NOR:NORDIC("#BA0C2F","#fff","#00205B"), SWE:NORDIC("#006AA7","#FECC02"),
  EGY:H3("#CE1126","#fff","#000")+R(13.5,8,3,4,"#C09300"),
  BRA:R(0,0,30,20,"#009C3B")+`<polygon points="3,10 15,2.5 27,10 15,17.5" fill="#FFDF00"/><circle cx="15" cy="10" r="4.6" fill="#002776"/>`,
  ARG:H3("#74ACDF","#fff","#74ACDF")+`<circle cx="15" cy="10" r="2" fill="#F6B40E"/>`,
  URU:STRIPES(9,"#fff","#0038A8")+R(0,0,11,11.1,"#fff")+`<circle cx="5.5" cy="5.5" r="3" fill="#FCD116"/>`,
  USA:STRIPES(13,"#B22234","#fff")+R(0,0,12,10.8,"#3C3B6E"),
  ECU:R(0,0,30,10,"#FFDD00")+R(0,10,30,5,"#034EA2")+R(0,15,30,5,"#ED1C24")+`<circle cx="15" cy="10" r="2.6" fill="#7a5a1e" opacity=".8"/>`,
  MAR:R(0,0,30,20,"#C1272D")+`<polygon points="15,5 17.94,14.05 10.25,8.45 19.75,8.45 12.06,14.05" fill="none" stroke="#006233" stroke-width="1"/>`,
  GEO:R(0,0,30,20,"#fff")+R(13,0,4,20,"#FF0000")+R(0,8,30,4,"#FF0000")+[[6.5,4],[23.5,4],[6.5,16],[23.5,16]].map(([x,y])=>R(x-.6,y-2,1.2,4,"#FF0000")+R(x-2,y-.6,4,1.2,"#FF0000")).join(""),
};
// 직접 그린 국기가 없는 나라는 ESPN 국기 이미지
let FLAG_IMG={};
const flag=k=>FLAG_SVG[k]?`<svg class="flag" viewBox="0 0 30 20" role="img" aria-label="${NAT[k]} 국기">${FLAG_SVG[k]}</svg>`

const RAW=[

function applyHash(){

  const a=h.slice(2).split("-");
  for(let i=0;i+1<a.length;i+=2){
    const k=a[i];let v=a[i+1];try{v=decodeURIComponent(v)}catch(e){}
    if(k==="o"&&OK.o.includes(v))st.sort=v;
    else if(k==="g"&&OK.g.includes(v))st.group=v;
    else if(k==="p"&&OK.p.includes(v))st.chip=v;
    else if(k==="n"&&OK.n.includes(v))st.nat=v;

    else if(k==="d"&&/^\d+$/.test(v))st.open=+v;
    else if(k==="y")st.youth=v==="1";
  }
  return true;
}

function gamesHTML(d){

  if(ev&&new Date(ev.date)>Date.now()-3*3600e3){

  }
  const st=d&&d.gameLog&&d.gameLog.statistics&&d.gameLog.statistics[0],evs=d&&d.gameLog&&d.gameLog.events||{};
  if(st&&st.events&&st.events.length){

    html+=`<ul class="glog">${st.events.slice(0,5).map(x=>{const e=evs[x.eventId];if(!e)return "";const t=kst(e.gameDate),r=RES[e.gameResult]||["",""];

async function wikiCareer(p){
  const title=p.espn.slice(2);
  try{
    const d=STAT_CACHE[p.espn]||(STAT_CACHE[p.espn]=await fetch(`https://ko.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&origin=*&prop=wikitext&section=0&redirects=1&page=${encodeURIComponent(title)}`).then(r=>r.ok?r.json():null));
    if(!$("season")||openNo!==p.no)return;
    const w=(d&&d.parse&&d.parse.wikitext)||"";
    const f=k=>{const m=w.match(new RegExp("\\|\\s*"+k+"\\s*=\\s*((?:\\[\\[[^\\]]*\\]\\]|\\{\\{[^}]*\\}\\}|[^\\n|])*)"));return m?m[1].trim():""};
    const plain=s=>s.replace(/\{\{[^{}]*\}\}/g,"").replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").replace(/<[^>]+>|'''?/g,"").trim();
    const club=[];for(let i=1;i<=20;i++){const c=plain(f("클럽"+i));if(c)club.push({y:plain(f("연도"+i)),club:c,app:plain(f("출전"+i)),g:plain(f("골"+i))})}
    const nat=[];for(let i=1;i<=10;i++){const c=plain(f("국가대표팀"+i));if(c)nat.push({y:plain(f("국가대표팀 연도"+i)),club:c,app:plain(f("국가대표팀 출전"+i)),g:plain(f("국가대표팀 골"+i))})}
    if(!club.length&&!nat.length){$("season").innerHTML=`<h3>경력 기록</h3><p class="thin">위키백과에 정리된 기록이 없습니다.</p>`;return}
    const upd=plain(f("클럽팀 최신 업데이트 날짜"));
    const tr=x=>`<tr><td>${esc(x.y)}</td><td>${esc(x.club)}</td><td>${esc(x.app||"-")}</td><td>${esc(x.g||"-")}</td></tr>`;
    $("season").innerHTML=`<h3>경력 기록<small><a href="https://ko.wikipedia.org/wiki/${encodeURIComponent(title)}" target="_blank" rel="noopener">위키백과</a>${upd?` · ${esc(upd)} 기준`:""}</small></h3>
      <table class="stbl car"><thead><tr><th>기간</th><th>팀</th><th>출전</th><th>골</th></tr></thead>
      <tbody>${club.map(tr).join("")}${nat.length?`<tr class="sub"><td colspan="4">국가대표</td></tr>`+nat.map(tr).join(""):""}</tbody></table>`;
  }catch(e){if($("season"))$("season").innerHTML=`<h3>경력 기록</h3><p class="thin">기록을 불러오지 못했습니다.</p>`}
}

// 리그·팀·나라 목록 위에는 검색 칸 (이름 일부, 초성, 팀 줄임말, 나라 코드로 찾기)

function syncDD(sel){

// 목록 안에서만 스크롤 (scrollIntoView는 바깥 필터 칸까지 움직여서 검색 칸이 가려짐)
function ddScroll(el){const l=el.parentElement,t=el.offsetTop-l.offsetTop;if(t<l.scrollTop)l.scrollTop=t;else if(t+el.offsetHeight>l.scrollTop+l.clientHeight)l.scrollTop=t+el.offsetHeight-l.clientHeight}
function filterDD(dd){
  const inp=dd.querySelector(".dd-q");if(!inp)return;
  const raw=inp.value.trim(),q=normS(raw),isCho=IS_CHO.test(raw.replace(/\s/g,"")),c=raw.replace(/\s/g,"");
  let n=0;
  dd.querySelectorAll(".dd-opt").forEach(li=>{
    const ok=!raw||(li.dataset.s&&(isCho?li.dataset.c.split("|").some(k=>k.startsWith(c)):li.dataset.s.includes(q)));
    li.hidden=!ok;li.classList.remove("active");if(ok)n++;
  });
  dd.querySelector(".dd-empty").hidden=n>0;
  const first=dd.querySelector(raw?".dd-opt:not([hidden])":'.dd-opt[aria-selected="true"]')||dd.querySelector(".dd-opt:not([hidden])");
  if(first){first.classList.add("active");ddScroll(first)}
}
let ddOpen=null;
function closeDD(){if(!ddOpen)return;ddOpen.querySelector(".dd-pop").hidden=true;ddOpen.querySelector(".dd-btn").setAttribute("aria-expanded","false");ddOpen=null}
function openDD(dd){
  closeDD();ddOpen=dd;
  dd.querySelector(".dd-pop").hidden=false;dd.querySelector(".dd-btn").setAttribute("aria-expanded","true");
  const inp=dd.querySelector(".dd-q");if(inp)inp.value="";
  filterDD(dd);
  if(!inp){const l=dd.querySelector(".dd-list");l.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));const s=l.querySelector('[aria-selected="true"]');if(s){s.classList.add("active");ddScroll(s)}}
  // PC에서는 열자마자 바로 입력 (폰은 키보드가 화면을 가리므로 칸을 누를 때만)
  if(inp&&matchMedia("(hover:hover)").matches)inp.focus();
}
document.addEventListener("input",e=>{if(e.target.classList&&e.target.classList.contains("dd-q"))filterDD(e.target.closest(".dd"))});
function pickDD(dd,i){
  const sel=dd.previousElementSibling;sel.selectedIndex=i;
  sel.dispatchEvent(new Event("change",{bubbles:true}));
  syncDD(sel);closeDD();dd.querySelector(".dd-btn").focus();
}
document.addEventListener("click",e=>{
  const btn=e.target.closest(".dd-btn");
  if(btn){e.preventDefault();const dd=btn.parentElement;ddOpen===dd?closeDD():openDD(dd);return}
  const opt=e.target.closest(".dd-opt");
  if(opt){e.preventDefault();pickDD(opt.closest(".dd"),+opt.dataset.i);return}
  if(!e.target.closest(".dd"))closeDD();
});
document.addEventListener("keydown",e=>{
  const dd=e.target.closest&&e.target.closest(".dd");if(!dd)return;
  const opts=[...dd.querySelectorAll(".dd-opt:not([hidden])")],inInput=e.target.classList.contains("dd-q");
  if(ddOpen!==dd){if(e.key==="ArrowDown"||e.key==="Enter"||e.key===" "){e.preventDefault();openDD(dd)}return}
  let a=opts.findIndex(o=>o.classList.contains("active"));
  if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeDD();dd.querySelector(".dd-btn").focus()}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();if(!opts.length)return;a=Math.max(0,Math.min(opts.length-1,a+(e.key==="ArrowDown"?1:-1)));
    opts.forEach(o=>o.classList.remove("active"));opts[a].classList.add("active");ddScroll(opts[a]);
  }
  else if(e.key==="Enter"||(e.key===" "&&!inInput)){e.preventDefault();if(a>=0)pickDD(dd,+opts[a].dataset.i)}
  else if(e.key==="Tab")closeDD();
});

      const lg=d&&d.nextGame&&d.nextGame.league,ev=lg&&(lg.events||[])[0];

      }

      const x=stt&&stt.events&&stt.events[0],e=x&&evs[x.eventId];

const STAND_LG=[["eng.1","프리미어리그"],["esp.1","라리가"],["ger.1","분데스리가"],["ita.1","세리에 A"],["fra.1","리그 1"],["kor.1","K리그1"],["kor.2","K리그2"]];
async function kleagueStand(lg){
  const api=q=>fetch(`https://ko.wikipedia.org/w/api.php?action=parse&format=json&origin=*&${q}`).then(r=>r.json());
  const y=new Date().getFullYear();
  for(const yr of [y,y-1]){
    const page=encodeURIComponent(`${yr}년 ${lg}`);
    const sj=await api(`prop=sections&page=${page}`);if(sj.error)continue;
    const sec=sj.parse.sections.find(x=>x.line==="시즌 순위");if(!sec)continue;
    const j=await api(`prop=text&section=${sec.index}&page=${page}`);
    const tb=new DOMParser().parseFromString(j.parse.text["*"],"text/html").querySelector("table.wikitable");if(!tb)continue;
    const head=[...tb.rows[0].cells].map(c=>c.textContent.trim());
    const col=n=>head.findIndex(h=>h===n);
    const ci={gp:col("경기"),w:col("승"),d:col("무"),l:col("패"),gd:col("차"),pts:col("승점")};
    const rows=[...tb.rows].slice(1).filter(r=>r.cells.length>6&&/^\d+$/.test(r.cells[0].textContent.trim())).map(r=>{
      const a=r.cells[1].querySelector("a"),t=c=>r.cells[c]?r.cells[c].textContent.trim():"";
      return {rank:+t(0),ko:(a?a.textContent:r.cells[1].textContent).replace(/\(.*?\)/g,"").trim(),gp:t(ci.gp),w:t(ci.w),d:t(ci.d),l:t(ci.l),gd:t(ci.gd).replace("−","-"),pts:t(ci.pts),logo:"",wiki:a?decodeURIComponent((a.getAttribute("href")||"").replace(/^.*\/wiki\//,"")):""}});
    if(rows.length)return {rows,src:"위키백과",yr};
  }
  throw new Error("no table");
}

async function loadComments(){

function drawComments(){
  if($("cmTabCount"))$("cmTabCount").textContent=cm.list.length?String(cm.list.length):"";
  const ul=$("cmList");if(!ul)return;
  $("cmCount").textContent=cm.list.length?String(cm.list.length):"";
  // 답글(parent_id 있음)은 원래 댓글 아래에 오래된 순으로. BEST·정렬은 일반 댓글만
  const tops=cm.list.filter(c=>!c.parent_id);
  const kids={};cm.list.filter(c=>c.parent_id).forEach(c=>(kids[c.parent_id]??=[]).push(c));
  Object.values(kids).forEach(a=>a.sort((x,y)=>x.id-y.id));
  const best=tops.filter(c=>c.up>=BEST_UP).sort((a,b)=>b.up-a.up).slice(0,3);
  const rest=tops.filter(c=>!best.includes(c));
  if(cm.sort==="best")rest.sort((a,b)=>(b.up-b.down)-(a.up-a.down)||b.id-a.id);
  const item=(c,isBest,isReply)=>`<li class="cm-item${isBest?" best":""}${isReply?" reply":""}" data-id="${c.id}">
      <div class="cm-meta">${isReply?'<span class="cm-re" aria-hidden="true">↳</span>':""}${isBest?'<span class="cm-best">BEST</span>':""}<b>${esc(c.nick)}</b><span class="ip">${c.ip_prefix?`(${esc(c.ip_prefix)})`:""}</span><time datetime="${esc(c.created_at)}">${fmtTime(c.created_at)}</time></div>

      ${!isReply&&kids[c.id]?`<ul class="cm-replies">${kids[c.id].map(r=>item(r,false,true)).join("")}</ul>`:""}
    </li>`;
  ul.innerHTML=tops.length?best.map(c=>item(c,true)).join("")+rest.map(c=>item(c,false)).join(""):`<li class="cm-empty">아직 댓글이 없습니다. 첫 댓글을 남겨 주세요.</li>`;
}

  const b=e.target.closest("[data-lg]");if(b){standLg=b.dataset.lg;renderStand();loadStand();return}
  const g=e.target.closest(".sti-go");if(g){pickStandClub(g.dataset.club);return}
  const p=e.target.closest(".sti-p");if(p){openDetail(+p.dataset.no);return}
  const r=e.target.closest("tr[data-i]");if(r)pickStandRow(+r.dataset.i);
});
$("stand").addEventListener("keydown",e=>{const r=e.target.closest("tr[data-i]");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pickStandRow(+r.dataset.i)}});
// 탭을 바꿔도 아래 목록이 위아래로 흔들리지 않게, 지금까지 본 탭 중 가장 높은 높이를 유지
function lockFeed(){const f=$("feed");f.style.minHeight=Math.max(f.offsetHeight,parseFloat(f.style.minHeight)||0)+"px"}
$("feedTabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;lockFeed();feedTab=b.dataset.t;feedChosen=true;syncFeed();requestAnimationFrame(lockFeed)});
$("kgames").addEventListener("click",e=>{const c=e.target.closest(".kg-it");if(c)openDetail(+c.dataset.no)});
$("moves").addEventListener("click",e=>{const c=e.target.closest(".hot-item");if(c)openDetail(+c.dataset.no)});
$("hot").addEventListener("click",e=>{
  if(e.target.id==="hotAll"){st.sort="hot";buildControls();save();render();return}
  const c=e.target.closest(".hot-item");if(c)openDetail(+c.dataset.no);
});
$("closeD").addEventListener("click",()=>$("dlg").close());
// 상세 화면의 나라·클럽·리그 ☆ 버튼. 이 브라우저에만 저장됨
let openNo=0;
// 상세 팝업 탭: 마지막으로 고른 탭을 다음 선수에도 그대로 (그 탭이 없는 선수면 첫 탭)
let dTab="stats";
// PC(넓은 화면)에서는 경기 탭을 따로 두지 않고 기록 탭 아래에 이어서 보여 줌
const WIDE=matchMedia("(min-width:821px)");
function syncDTab(){
  const w=WIDE.matches,cur=w&&dTab==="games"?"stats":dTab;
  document.querySelectorAll("#dBody [data-dt]").forEach(x=>x.setAttribute("aria-selected",x.dataset.dt===cur));
  document.querySelectorAll("#dBody .d-pane").forEach(x=>x.hidden=!(x.dataset.pane===cur||(w&&cur==="stats"&&x.dataset.pane==="games")));
}
WIDE.addEventListener("change",syncDTab);
$("dBody").addEventListener("click",e=>{const b=e.target.closest("[data-dt]");if(!b)return;dTab=b.dataset.dt;syncDTab()});
$("dBody").addEventListener("click",e=>{
  const b=e.target.closest(".fav-btn");if(!b)return;const fv=b.dataset.kind==="player"?+b.dataset.v:b.dataset.v;
  toggleFav(b.dataset.kind,fv);
  b.setAttribute("aria-pressed",isFavOf(b.dataset.kind,fv));
  b.textContent=isFavOf(b.dataset.kind,fv)?"★":"☆";
  b.title=isFavOf(b.dataset.kind,fv)?"즐겨찾기 해제":"즐겨찾기에 추가";
});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("dlg").addEventListener("close",()=>{st.open=0;save()});
$("out").parentElement.addEventListener("click",e=>{if(e.target.closest("#moreBtn"))showMore()});
// 전체 명단(data/players.json, 매주 GitHub Actions가 ESPN 명단으로 갱신)을 받아 60명 뒤에 붙임
// [번호, 한글명, 영문명, 포지션(GK/DF/MF/FW), 나라 코드, 클럽, 리그, 출생연도, 키, 등번호]
// 명단은 매주 바뀌어서 브라우저 캐시를 그대로 씀 (GitHub Pages는 10분 뒤 새로 확인)
// 두 번에 나눠 받음: players-a(5대 리그·한국 선수·K리그1 + 나라·팀 이름표)를 먼저 그리고, players-b(나머지)를 이어 붙임
// 나눈 파일이 아직 없으면(예전 배포) players.json 하나를 받음
const rowToPlayer=r=>({no:r[0],kr:r[1],en:r[2],pos:POS[r[3]]?r[3]:"FW",g:(POS[r[3]]||POS.FW)[0],nat:r[4],club:r[5],league:r[6],born:r[7],h:r[8],num:r[9],espn:r[10]||"",foot:""});
function addPlayers(rows){
  players=players.concat(rows.map(rowToPlayer));
  reindex();
  if(location.hash.startsWith("#v-"))applyHash();
  buildControls();render();
}
function setupMeta(d){
  Object.entries(d.nat||{}).forEach(([k,v])=>{if(!NAT[k])NAT[k]=v});
  FLAG_IMG=d.flag||{};TEAM_KO=d.teams||{};LEAGUE_ORDER=d.leagues||[];
  // 직접 입력한 60명도 이적하면 최신 클럽·리그로 (한글 팀명이 있을 때만)
  Object.entries(d.curated||{}).forEach(([no,[club,league,espn,num]])=>{const p=BY_NO[no];if(!p)return;if(espn)p.espn=espn;if(num)p.num=num;if(/[가-힣]/.test(club)){p.club=club;p.league=league}});
  DATA_AT=d.generated_at||"";
  $("dataAt").textContent=DATA_AT?`(마지막 갱신 ${DATA_AT.slice(0,10)})`:"";
}
const getJSON=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
getJSON("data/players-a.json").then(async a=>{
  if(a&&Array.isArray(a.players)){
    setupMeta(a);addPlayers(a.players);checkStale();loadFavGames();
    const b=await getJSON("data/players-b.json");if(b&&Array.isArray(b.players))addPlayers(b.players);
  }else{
    const d=await getJSON("data/players.json");if(!d||!Array.isArray(d.players))return;
    setupMeta(d);addPlayers(d.players);checkStale();loadFavGames();
  }
  const ph=await photosReq;
  if(ph){WPHOTO=ph;render();if(st.open&&$("dlg").open)openDetail(st.open)}
}).catch(()=>{}).finally(()=>{if(st.open&&BY_NO[st.open]&&!$("dlg").open)openDetail(st.open)});
mountAd("adFeed",MONEY.adfit.feed);
// 주소에 선수 번호가 있으면(공유 링크) 그 선수 화면을 바로 열기. 61번 이후는 명단을 받은 뒤 열림
if(st.open&&BY_NO[st.open])openDetail(st.open);
</script>
